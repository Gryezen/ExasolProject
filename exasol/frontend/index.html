<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Case Registry — Document Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --surface: #1b1f27;
    --surface-raised: #232833;
    --hairline: #2e3542;
    --ink: #e8e6df;
    --muted: #8b92a0;
    --faint: #5b6270;
    --accent: #4fa8a0;
    --accent-dim: #34625d;
    --high: #d9724a;
    --high-dim: #4a2f26;
    --medium: #d9a84a;
    --medium-dim: #4a3f26;
    --low: #6b9b5e;
    --low-dim: #2c3a27;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  ::selection { background: var(--accent-dim); }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  a { color: inherit; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--hairline);
    background: var(--surface-raised);
    color: var(--ink);
    border-radius: 3px;
    padding: 7px 12px;
    font-size: 13px;
    transition: border-color .15s ease, background .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent-dim); border-color: var(--accent); color: #cdece7; }
  button.primary:hover:not(:disabled) { background: var(--accent); color: #0e1614; }
  button.danger { border-color: var(--high); }
  button.danger:hover:not(:disabled) { background: var(--high-dim); }
  input[type=text], textarea {
    font-family: inherit;
    background: var(--bg);
    border: 1px solid var(--hairline);
    color: var(--ink);
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 13px;
  }
  input[type=text]:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ---------- shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header.top {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
  }
  header.top .mark {
    font-family: 'Fraunces', serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  header.top .mark .stamp {
    display: inline-block;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .08em;
    padding: 1px 6px;
    border-radius: 2px;
    vertical-align: middle;
    margin-left: 8px;
    transform: translateY(-2px);
  }
  header.top .tagline { color: var(--muted); font-size: 12.5px; }
  header.top .spacer { flex: 1; }
  header.top .threshold {
    color: var(--faint);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ---------- sidebar / registry ---------- */
  aside.registry {
    border-right: 1px solid var(--hairline);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .registry-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .registry-head .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .12em;
    color: var(--faint);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .dropzone {
    border: 1px dashed var(--hairline);
    border-radius: 4px;
    padding: 14px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--ink); }
  .dropzone input { display: none; }
  .upload-status { font-size: 11.5px; color: var(--faint); margin-top: 8px; min-height: 14px; font-family: 'IBM Plex Mono', monospace; }

  .doc-list { flex: 1; overflow-y: auto; }
  .doc-item {
    padding: 12px 18px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    position: relative;
  }
  .doc-item:hover { background: var(--surface-raised); }
  .doc-item.active { background: var(--surface-raised); }
  .doc-item.active::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--accent);
  }
  .doc-item .fname { font-size: 13px; font-weight: 500; margin-bottom: 4px; word-break: break-word; }
  .doc-item .meta { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--faint); }
  .doc-item .docid { font-family: 'IBM Plex Mono', monospace; }

  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid;
    white-space: nowrap;
  }
  .badge.uploaded, .badge.extracting { color: var(--muted); border-color: var(--hairline); }
  .badge.review { color: var(--medium); border-color: var(--medium); background: var(--medium-dim); }
  .badge.reasoning { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
  .badge.complete { color: var(--low); border-color: var(--low); background: var(--low-dim); }
  .badge.failed { color: var(--high); border-color: var(--high); background: var(--high-dim); }
  .badge.high { color: var(--high); border-color: var(--high); background: var(--high-dim); }
  .badge.medium { color: var(--medium); border-color: var(--medium); background: var(--medium-dim); }
  .badge.low { color: var(--low); border-color: var(--low); background: var(--low-dim); }

  .empty-list { padding: 24px 18px; color: var(--faint); font-size: 12.5px; text-align: center; }

  /* ---------- main ---------- */
  main.workspace { overflow-y: auto; display: flex; flex-direction: column; }
  .no-doc {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-family: 'Fraunces', serif; font-size: 18px;
  }

  .doc-header {
    padding: 22px 28px 16px;
    border-bottom: 1px solid var(--hairline);
    display: flex; align-items: flex-start; gap: 18px;
  }
  .doc-header .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    word-break: break-word;
  }
  .doc-header .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .doc-header .sub .mono { color: var(--faint); }
  .doc-header .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }

  nav.tabs {
    display: flex; gap: 2px; padding: 0 28px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
  }
  nav.tabs button.tab {
    border: none; border-bottom: 2px solid transparent;
    background: transparent; border-radius: 0;
    padding: 12px 4px; margin-right: 22px;
    color: var(--muted); font-size: 13px;
  }
  nav.tabs button.tab:hover { color: var(--ink); border-color: var(--hairline); }
  nav.tabs button.tab.active { color: var(--ink); border-color: var(--accent); }
  nav.tabs button.tab .count {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--faint); margin-left: 5px;
  }

  .tab-panel { padding: 22px 28px 40px; }
  .tab-panel.hidden { display: none; }

  /* fields table */
  table.fields { width: 100%; border-collapse: collapse; }
  table.fields th {
    text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--hairline);
  }
  table.fields td { padding: 10px 10px; border-bottom: 1px solid var(--hairline); font-size: 13px; vertical-align: top; }
  table.fields tr.low-conf td:first-child { border-left: 2px solid var(--medium); }
  .conf-bar {
    display: inline-flex; align-items: center; gap: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
  }
  .conf-track { width: 52px; height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .conf-fill { height: 100%; background: var(--low); }
  .conf-fill.low { background: var(--medium); }

  .review-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .review-row input[type=text] { flex: 1; padding: 5px 8px; font-size: 12px; }
  .review-row button { padding: 4px 9px; font-size: 11.5px; }

  /* discrepancies */
  .disc-card, .action-card {
    border: 1px solid var(--hairline); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; background: var(--surface);
  }
  .disc-card .disc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .disc-card .field-name { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--accent); }
  .disc-values { display: flex; gap: 18px; margin: 8px 0; }
  .disc-values .v { flex: 1; }
  .disc-values .v .label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 3px; }
  .disc-values .v .val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .disc-card .explain { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  /* case file / linked documents */
  .case-card {
    border: 1px solid var(--hairline); border-radius: 4px; padding: 13px 16px; margin-bottom: 10px;
    background: var(--surface); display: flex; align-items: center; gap: 14px; cursor: pointer;
    transition: border-color .15s ease;
  }
  .case-card:hover { border-color: var(--accent); }
  .case-card .c-main { flex: 1; min-width: 0; }
  .case-card .c-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; word-break: break-word; }
  .case-card .c-meta { font-size: 11.5px; color: var(--faint); }
  .case-card .c-rel {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--accent);
    border: 1px solid var(--accent-dim); border-radius: 2px; padding: 3px 8px; white-space: nowrap;
  }
  .case-card .c-conf { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--faint); white-space: nowrap; }

  .action-card .a-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .action-card .a-type { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .action-card .content { white-space: pre-wrap; font-size: 12.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--hairline); border-radius: 3px; padding: 10px 12px; margin: 8px 0; }
  .action-card .a-controls { display: flex; gap: 8px; margin-top: 8px; }

  .empty-panel { color: var(--faint); font-size: 13px; padding: 20px 0; }

  /* audit ledger */
  .ledger { border-left: 1px solid var(--hairline); margin-left: 8px; }
  .ledger-entry { position: relative; padding: 0 0 20px 22px; }
  .ledger-entry::before {
    content: ""; position: absolute; left: -5px; top: 3px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--accent);
  }
  .ledger-entry .l-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
  .ledger-entry .l-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--faint); }
  .ledger-entry .l-agent {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); border: 1px solid var(--accent-dim); padding: 1px 6px; border-radius: 2px;
  }
  .ledger-entry .l-action { font-size: 13px; font-weight: 500; }
  .ledger-entry .l-summary { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .ledger-entry .l-summary .k { color: var(--faint); }

  /* chat */
  .chat-dock {
    border-top: 1px solid var(--hairline);
    background: var(--surface);
    padding: 14px 28px 18px;
  }
  .chat-dock .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 8px;
  }
  .chat-form { display: flex; gap: 8px; }
  .chat-form input[type=text] { flex: 1; }
  .chat-examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .chat-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 12px; padding: 4px 10px;
    background: transparent; cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .chat-chip:hover { border-color: var(--accent); color: var(--ink); }
  .chat-result { margin-top: 12px; }
  .chat-result .explanation { font-size: 13px; color: var(--ink); margin-bottom: 8px; }
  .chat-result .sql-box {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--accent);
    background: var(--bg); border: 1px solid var(--hairline); border-radius: 3px; padding: 8px 10px; margin-bottom: 10px;
    white-space: pre-wrap; word-break: break-all;
  }
  .chat-result .sql-error { color: var(--high); }
  table.chat-rows { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.chat-rows th { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--hairline); color: var(--faint); font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  table.chat-rows td { padding: 6px 9px; border-bottom: 1px solid var(--hairline); font-family: 'IBM Plex Mono', monospace; }
  .chat-loading { color: var(--faint); font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="mark">CASE_REGISTRY<span class="stamp">office copy</span></div>
    <div class="tagline">document intelligence for citizen case files — extraction · reasoning · action · audit</div>
    <div class="spacer"></div>
    <div class="threshold" id="thresholdBadge"></div>
  </header>

  <aside class="registry">
    <div class="registry-head">
      <div class="eyebrow">Intake</div>
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tiff,.bmp,.txt">
        <div>Drop a scanned certificate, form or receipt — or click to upload</div>
      </label>
      <div class="upload-status" id="uploadStatus"></div>
    </div>
    <div class="doc-list" id="docList">
      <div class="empty-list">No documents yet.</div>
    </div>
  </aside>

  <main class="workspace">
    <div class="no-doc" id="noDocMsg">Select or upload a document to open its case file.</div>

    <div id="docView" style="display:none; flex:1; display:flex; flex-direction:column;">
      <div class="doc-header">
        <div>
          <div class="title" id="docTitle">—</div>
          <div class="sub" id="docSub">—</div>
        </div>
        <div class="actions" id="docActions"></div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-tab="fields">Fields<span class="count" id="countFields"></span></button>
        <button class="tab" data-tab="case">Case File<span class="count" id="countCase"></span></button>
        <button class="tab" data-tab="discrepancies">Discrepancies &amp; Actions<span class="count" id="countDisc"></span></button>
        <button class="tab" data-tab="audit">Audit Timeline<span class="count" id="countAudit"></span></button>
      </nav>

      <div class="tab-panel" id="panel-fields"></div>
      <div class="tab-panel hidden" id="panel-case"></div>
      <div class="tab-panel hidden" id="panel-discrepancies"></div>
      <div class="tab-panel hidden" id="panel-audit"></div>

      <div style="flex:1"></div>
    </div>

    <div class="chat-dock">
      <div class="eyebrow">Ask the registry</div>
      <form class="chat-form" id="chatForm">
        <input type="text" id="chatInput" placeholder="e.g. Show all welfare applicants earning below ₹2,00,000">
        <button type="submit" class="primary">Ask</button>
      </form>
      <div class="chat-examples" id="chatExamples"></div>
      <div class="chat-result" id="chatResult"></div>
    </div>
  </main>
</div>

<script>
const API = "";
let config = { confidence_threshold: 0.8 };
let documents = [];
let selectedDocId = null;
let activeTab = "fields";

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTime(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}); }
  catch { return ts; }
}
function shortId(id) { return id ? id.slice(0, 8) : ""; }

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  const isJson = (res.headers.get("content-type") || "").includes("application/json");
  const body = isJson ? await res.json() : null;
  if (!res.ok) throw new Error((body && body.error) || `Request failed (${res.status})`);
  return body;
}

/* ---------------- config + document list ---------------- */

async function loadConfig() {
  try {
    config = await api("/api/config");
    document.getElementById("thresholdBadge").textContent =
      `confidence gate ≥ ${config.confidence_threshold}`;
  } catch (e) { /* fine to run with the default */ }
}

async function loadDocuments() {
  let docs;
  try { docs = await api("/api/documents"); }
  catch (e) { return; }
  documents = docs;
  renderDocList();
}

function renderDocList() {
  const el = document.getElementById("docList");
  if (!documents.length) {
    el.innerHTML = `<div class="empty-list">No documents yet. Upload a certificate, application or receipt above to start the pipeline.</div>`;
    return;
  }
  el.innerHTML = documents.map(d => `
    <div class="doc-item ${d.doc_id === selectedDocId ? 'active' : ''}" data-id="${esc(d.doc_id)}">
      <div class="fname">${esc(d.filename)}</div>
      <div class="meta">
        <span class="badge ${esc(d.status)}">${esc(d.status)}</span>
        <span class="docid">${esc(shortId(d.doc_id))}</span>
        ${d.vendor ? `<span>· ${esc(d.vendor)}</span>` : ""}
      </div>
    </div>
  `).join("");
  el.querySelectorAll(".doc-item").forEach(node => {
    node.addEventListener("click", () => selectDocument(node.dataset.id));
  });
}

/* ---------------- upload ---------------- */

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const uploadStatus = document.getElementById("uploadStatus");

fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
});
["dragover", "dragenter"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); })
);
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
);
dropzone.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) uploadFile(f);
});

async function uploadFile(file) {
  uploadStatus.textContent = `ingesting ${file.name}…`;
  const formData = new FormData();
  formData.append("file", file);
  try {
    const result = await api("/api/documents/upload", { method: "POST", body: formData });
    uploadStatus.textContent =
      `done — ${result.field_count} field(s), gate: ${result.gate_decision}`;
    fileInput.value = "";
    await loadDocuments();
    selectDocument(result.doc_id);
  } catch (e) {
    uploadStatus.textContent = `failed: ${e.message}`;
  }
}

/* ---------------- document detail ---------------- */

async function selectDocument(docId) {
  selectedDocId = docId;
  document.getElementById("noDocMsg").style.display = "none";
  document.getElementById("docView").style.display = "flex";
  renderDocList();
  await refreshDocumentDetail();
}

async function refreshDocumentDetail() {
  if (!selectedDocId) return;
  const [doc, fields, discrepancies, actions, audit, related] = await Promise.all([
    api(`/api/documents/${selectedDocId}`).catch(() => null),
    api(`/api/documents/${selectedDocId}/fields`).catch(() => []),
    api(`/api/documents/${selectedDocId}/discrepancies`).catch(() => []),
    api(`/api/documents/${selectedDocId}/actions`).catch(() => []),
    api(`/api/documents/${selectedDocId}/audit`).catch(() => []),
    api(`/api/documents/${selectedDocId}/related`).catch(() => []),
  ]);
  if (!doc) return;

  document.getElementById("docTitle").textContent = doc.filename;
  document.getElementById("docSub").innerHTML =
    `<span class="mono">${esc(doc.doc_id)}</span> · ${esc(doc.document_type || "unclassified")}` +
    (doc.vendor ? ` · ${esc(doc.vendor)}` : "") +
    ` · <span class="badge ${esc(doc.status)}">${esc(doc.status)}</span>`;

  renderDocActions(doc);
  renderFields(fields, doc.status);
  renderCaseFile(related);
  renderDiscrepancies(discrepancies, actions);
  renderAudit(audit);

  document.getElementById("countFields").textContent = fields.length ? `(${fields.length})` : "";
  document.getElementById("countCase").textContent = related.length ? `(${related.length})` : "";
  document.getElementById("countDisc").textContent = discrepancies.length ? `(${discrepancies.length})` : "";
  document.getElementById("countAudit").textContent = audit.length ? `(${audit.length})` : "";
}

function renderDocActions(doc) {
  const el = document.getElementById("docActions");
  el.innerHTML = "";
  if (doc.status === "reasoning") {
    const btn = document.createElement("button");
    btn.className = "primary";
    btn.textContent = "Run reasoning & draft actions";
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Reasoning…";
      try { await api(`/api/documents/${doc.doc_id}/process`, { method: "POST" }); }
      catch (e) { alert(e.message); }
      await loadDocuments();
      await refreshDocumentDetail();
    };
    el.appendChild(btn);
  }
  const refresh = document.createElement("button");
  refresh.textContent = "Refresh";
  refresh.onclick = refreshDocumentDetail;
  el.appendChild(refresh);
}

function renderFields(fields, docStatus) {
  const el = document.getElementById("panel-fields");
  if (!fields.length) {
    el.innerHTML = `<div class="empty-panel">No fields extracted for this document.</div>`;
    return;
  }
  const threshold = config.confidence_threshold;
  el.innerHTML = `
    <table class="fields">
      <thead><tr><th>Field</th><th>Value</th><th>Confidence</th><th>Source</th></tr></thead>
      <tbody>
        ${fields.map(f => {
          const conf = f.confidence === null || f.confidence === undefined ? null : Number(f.confidence);
          const low = conf !== null && conf < threshold;
          return `
          <tr class="${low ? 'low-conf' : ''}" data-field-id="${esc(f.field_id)}">
            <td class="mono">${esc(f.field_name)}</td>
            <td>${esc(f.value)}</td>
            <td>
              ${conf === null ? '<span class="mono" style="color:var(--faint)">—</span>' : `
                <span class="conf-bar">
                  <span class="conf-track"><span class="conf-fill ${low ? 'low' : ''}" style="width:${Math.round(conf*100)}%"></span></span>
                  ${conf.toFixed(2)}
                </span>`}
              ${low && docStatus === "review" ? `
                <div class="review-row">
                  <input type="text" class="review-input" placeholder="corrected value" value="${esc(f.value)}">
                  <button class="review-confirm" title="Confirm as-is">Confirm</button>
                  <button class="review-correct" title="Save corrected value">Correct</button>
                </div>` : ""}
            </td>
            <td class="mono" style="color:var(--faint)">${esc(f.source_agent || "")}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;

  el.querySelectorAll(".review-confirm, .review-correct").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const row = e.target.closest("tr");
      const fieldId = row.dataset.fieldId;
      const field = fields.find(f => f.field_id === fieldId);
      const input = row.querySelector(".review-input");
      const isCorrect = e.target.classList.contains("review-correct");
      const humanValue = isCorrect ? input.value : field.value;
      const status = isCorrect ? "corrected" : "confirmed";
      e.target.disabled = true;
      try {
        await api("/api/reviews", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            doc_id: selectedDocId,
            field_id: fieldId,
            field_name: field.field_name,
            ai_value: field.value,
            human_value: humanValue,
            status,
            reviewed_by: "case_handler",
          }),
        });
        await loadDocuments();
        await refreshDocumentDetail();
      } catch (err) {
        alert(err.message);
        e.target.disabled = false;
      }
    });
  });
}

function renderCaseFile(related) {
  const el = document.getElementById("panel-case");
  if (!related.length) {
    el.innerHTML = `<div class="empty-panel">No linked documents yet. Once a related document (e.g. an income certificate for this welfare application) is uploaded and matched, it will appear here as part of the same case.</div>`;
    return;
  }
  el.innerHTML = related.map(r => `
    <div class="case-card" data-id="${esc(r.doc_id)}">
      <div class="c-main">
        <div class="c-name">${esc(r.filename)}</div>
        <div class="c-meta">${esc(r.document_type || "unclassified")}${r.vendor ? ` · ${esc(r.vendor)}` : ""} · <span class="badge ${esc(r.status)}">${esc(r.status)}</span></div>
      </div>
      <div class="c-rel">${esc((r.relationship_type || "").replace(/_/g, " "))}</div>
      ${r.confidence !== null && r.confidence !== undefined ? `<div class="c-conf">${Number(r.confidence).toFixed(2)}</div>` : ""}
    </div>
  `).join("");
  el.querySelectorAll(".case-card").forEach(node => {
    node.addEventListener("click", () => selectDocument(node.dataset.id));
  });
}

function renderDiscrepancies(discrepancies, actions) {
  const el = document.getElementById("panel-discrepancies");
  if (!discrepancies.length) {
    el.innerHTML = `<div class="empty-panel">No discrepancies found yet. Run reasoning once the document reaches the "reasoning" stage.</div>`;
    return;
  }
  el.innerHTML = discrepancies.map(d => {
    const relatedActions = actions.filter(a => a.discrepancy_id === d.discrepancy_id);
    return `
      <div class="disc-card">
        <div class="disc-head">
          <span class="badge ${esc(d.severity)}">${esc(d.severity)}</span>
          <span class="field-name">${esc(d.field_name)}</span>
          <span style="color:var(--faint); font-size:11.5px;">${esc(d.status)}</span>
        </div>
        <div class="disc-values">
          <div class="v"><div class="label">Document A</div><div class="val">${esc(d.value_1)}</div></div>
          <div class="v"><div class="label">Document B</div><div class="val">${esc(d.value_2)}</div></div>
        </div>
        <div class="explain">${esc(d.explanation || "")}</div>
        ${relatedActions.length ? relatedActions.map(a => `
          <div class="action-card" data-action-id="${esc(a.action_id)}">
            <div class="a-head">
              <span class="a-type">${esc(a.action_type.replace('_', ' '))}</span>
              <span class="badge ${a.status === 'proposed' ? 'medium' : (a.status === 'approved' ? 'low' : 'high')}">${esc(a.status)}</span>
            </div>
            <div class="content">${esc(a.content)}</div>
            ${a.status === "proposed" ? `
              <div class="a-controls">
                <button class="primary act-approve">Approve</button>
                <button class="danger act-reject">Reject</button>
              </div>` : `<div style="font-size:11.5px; color:var(--faint);">decided by ${esc(a.decided_by || "—")}</div>`}
          </div>
        `).join("") : ""}
      </div>
    `;
  }).join("");

  el.querySelectorAll(".act-approve, .act-reject").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const card = e.target.closest(".action-card");
      const actionId = card.dataset.actionId;
      const decision = e.target.classList.contains("act-approve") ? "approved" : "rejected";
      btn.disabled = true;
      try {
        await api(`/api/actions/${actionId}/decide`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision, decided_by: "case_handler" }),
        });
        await refreshDocumentDetail();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
  });
}

function renderAudit(audit) {
  const el = document.getElementById("panel-audit");
  if (!audit.length) {
    el.innerHTML = `<div class="empty-panel">No audit events recorded yet.</div>`;
    return;
  }
  el.innerHTML = `<div class="ledger">${audit.map(a => `
    <div class="ledger-entry">
      <div class="l-top">
        <span class="l-time">${esc(fmtTime(a.timestamp))}</span>
        <span class="l-agent">${esc(a.agent_name)}</span>
      </div>
      <div class="l-action">${esc((a.action || "").replace(/_/g, " "))}${a.confidence !== null && a.confidence !== undefined ? ` <span class="mono" style="color:var(--faint); font-weight:400; font-size:11.5px;">(${Number(a.confidence).toFixed(2)})</span>` : ""}</div>
      <div class="l-summary">${a.input_summary ? `<span class="k">in:</span> ${esc(a.input_summary)}` : ""}</div>
      <div class="l-summary">${a.output_summary ? `<span class="k">out:</span> ${esc(a.output_summary)}` : ""}</div>
    </div>
  `).join("")}</div>`;
}

/* ---------------- tabs ---------------- */

document.querySelectorAll("nav.tabs .tab").forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll("nav.tabs .tab").forEach(b => b.classList.toggle("active", b === btn));
    ["fields", "case", "discrepancies", "audit"].forEach(t => {
      document.getElementById(`panel-${t}`).classList.toggle("hidden", t !== activeTab);
    });
  });
});

/* ---------------- chat ---------------- */

document.getElementById("chatForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const question = input.value.trim();
  if (!question) return;
  await runChatQuestion(question);
});

async function runChatQuestion(question) {
  document.getElementById("chatInput").value = question;
  const resultEl = document.getElementById("chatResult");
  resultEl.innerHTML = `<div class="chat-loading">translating to SQL…</div>`;
  try {
    const result = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    renderChatResult(result);
  } catch (err) {
    resultEl.innerHTML = `<div class="chat-result"><div class="explanation sql-error">${esc(err.message)}</div></div>`;
  }
}

const CHAT_EXAMPLES = [
  "Show all welfare applicants earning below ₹2,00,000",
  "Find land records owned by Ravi Kumar",
  "List complaints from Chennai district",
  "Show contractors bidding above ₹1 crore",
  "Which documents are still waiting on human review?",
];
document.getElementById("chatExamples").innerHTML = CHAT_EXAMPLES.map(q =>
  `<button type="button" class="chat-chip">${esc(q)}</button>`
).join("");
document.querySelectorAll(".chat-chip").forEach(chip => {
  chip.addEventListener("click", () => runChatQuestion(chip.textContent));
});

function renderChatResult(result) {
  const resultEl = document.getElementById("chatResult");
  if (result.error) {
    resultEl.innerHTML = `
      <div class="explanation">${esc(result.explanation || "")}</div>
      <div class="sql-box sql-error">rejected: ${esc(result.error)}</div>
    `;
    return;
  }
  const columns = result.columns || (result.rows && result.rows[0] ? result.rows[0].map((_, i) => `col_${i}`) : []);
  const rowsHtml = (result.rows || []).length
    ? `<table class="chat-rows">
        <thead><tr>${columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${result.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>`
    : `<div style="color:var(--faint); font-size:12.5px;">No rows returned.</div>`;
  resultEl.innerHTML = `
    <div class="explanation">${esc(result.explanation || "")}</div>
    <div class="sql-box">${esc(result.sql || "")}</div>
    ${rowsHtml}
  `;
}

/* ---------------- boot ---------------- */

(async function init() {
  await loadConfig();
  await loadDocuments();
  setInterval(loadDocuments, 8000);
})();
</script>
</body>
</html>
